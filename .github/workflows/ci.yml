name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: lish-lsp
    runs-on: ubuntu-latest
    steps:
      # lish-lsp's build.zig.zon pins `.lish = .path "../lish"`, so lish
      # must sit beside it. Tests against lish's main branch.
      - name: Checkout lish-lsp
        uses: actions/checkout@v4
        with:
          path: lish-lsp
      - name: Checkout lish
        uses: actions/checkout@v4
        with:
          repository: mhogle25/lish
          path: lish
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: zig build test
        working-directory: lish-lsp
        run: zig build test
      # Keep every tracked text file ASCII-only: no smart quotes, em-dashes,
      # arrows, or emoji. Everything should be typeable on a US keyboard.
      # (-I skips binary files.)
      - name: ASCII-only source
        working-directory: lish-lsp
        run: |
          if git grep -nIP '[^\x00-\x7F]' -- .; then
            echo "::error::Non-ASCII characters found above. Replace them with ASCII equivalents."
            exit 1
          fi
